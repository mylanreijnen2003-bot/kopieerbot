name: var-rest

# Varianten: toets opnieuw draaien voor gekozen groepen met data van een eerdere varianten-run, en alles opslaan.
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "varianten-run met var-stats/var-uni/var-sel", required: true}
      groepen: {description: 'JSON-lijst groepen', required: true, default: '["swing","actief"]'}

permissions:
  contents: write
  actions: read

env:
  KLUIS_KEY: ${{ secrets.DATA_KEY }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        groep: ${{ fromJSON(inputs.groepen) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - uses: actions/download-artifact@v4
        with: {pattern: "var-stats-*", path: st, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {name: var-uni, path: uni, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - run: python -m bt.var_select ${{ matrix.groep }} st uni/universe.parquet out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "var-sel-${{ matrix.groep }}", path: out, retention-days: 30}

  opslaan:
    needs: select
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with: {pattern: "var-sel-*", path: oud, merge-multiple: true, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {pattern: "var-sel-*", path: nieuw, merge-multiple: true}
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results && python3 bt/kluis.py open res
      - run: mkdir -p res/varianten && cp oud/* res/varianten/ ; cp nieuw/* res/varianten/ ; python -m bt.var_summary res/varianten
      - name: Opslaan
        if: always()
        run: |
          cd res && python3 ../bt/kluis.py dicht . && git add -A varianten
          git commit -qm "varianten $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
