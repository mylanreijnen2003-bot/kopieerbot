name: orderly-probe

# Orderly stap 0 + 1 (orderly/probe.py), uitkomst op branch results, map orderly/
on:
  workflow_dispatch:
  push:
    branches: [orderly]
    paths: ["orderly/**", ".github/workflows/orderly-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
          rm -rf res/orderly/probe && mkdir -p res/orderly/probe
          echo "gestart $(date -u)" > res/orderly/probe/status.txt
          cd res && git add -A orderly && git commit -qm "orderly probe gestart [skip ci]" && git push -q origin HEAD:results || true
      - run: python -m orderly.probe res/orderly/probe
      - name: Opslaan
        if: always()
        run: |
          echo "klaar $(date -u) status ${{ job.status }}" >> res/orderly/probe/status.txt
          cd res && git add -A orderly
          git commit -qm "orderly probe $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
