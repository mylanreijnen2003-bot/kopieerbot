name: diagnose

# Eenmalig: speelt de oude papieren bot (H3) na voor de 5 slechtste wallets. Uitkomst op branch results, map diagnose/.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: {group: results, cancel-in-progress: false}

env:
  KLUIS_KEY: ${{ secrets.DATA_KEY }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 bt/kluis.py open data
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin results; then
            git fetch origin results && git worktree add -B results res origin/results && python3 bt/kluis.py open res
          else
            git worktree add --detach res && cd res && git checkout --orphan results && git rm -rfq . && cd ..
          fi
      - run: python -m bot.diagnose res/diagnose
      - name: Samenvatting als annotatie
        if: always()
        run: python -c "import json; [print('::notice title=diagnose::'+json.dumps(s,default=str)) for s in json.load(open('res/diagnose/samenvatting.json'))]" || echo "::error::geen samenvatting"
      - name: Opslaan
        if: always()
        run: |
          cd res && python3 ../bt/kluis.py dicht . && git add -A diagnose
          git commit -qm "diagnose $(date -u +%F) [skip ci]" || true
          git push origin HEAD:results
