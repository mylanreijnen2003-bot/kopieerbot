name: swing-h

# Swingsysteem H "trend + kleine terugval" (vooraf vastgelegd 12 okt 2026). Uitkomst: results/swing_h/.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KLUIS_KEY: ${{ secrets.DATA_KEY }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy requests tabulate pyarrow
      - run: git fetch origin results && python3 bt/kluis.py show papier2/kraken.json > kraken.json
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git worktree add -B results res origin/results && python3 bt/kluis.py open res
      - run: rm -rf res/swing_h && mkdir -p res/swing_h && python -m bt.swing_h kraken.json res/swing_h 2>&1 | tee res/swing_h/log.txt
      - name: Opslaan
        if: ${{ !cancelled() }}
        run: |
          cd res && python3 ../bt/kluis.py dicht . && git add -A swing_h
          git commit -qm "swing_h $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
