name: kansen-unlocks

# V4 short vóór grote unlocks (kansen/unlocks.py). Alleen publieke marktdata, geen adressen.
on:
  push:
    branches: [kansen]
    paths: ["kansen/unlocks.py", ".github/workflows/kansen-unlocks.yml"]

permissions:
  contents: write

jobs:
  unlocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
          rm -rf res/kansen/unlocks && mkdir -p res/kansen/unlocks
      - run: python -m kansen.unlocks res/kansen/unlocks cache
      - name: Opslaan
        if: ${{ !cancelled() }}
        run: |
          cd res
          for i in 1 2 3 4 5; do
            git fetch -q origin results && git reset -q --soft origin/results
            git add -A kansen/unlocks
            git commit -qm "kansen unlocks $(date -u +%F) [skip ci]" || true
            git push -q origin HEAD:results && break; sleep 10
          done
