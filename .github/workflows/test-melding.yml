name: test-melding

# Stuurt één testmelding naar de telefoon (ntfy), in hetzelfde formaat als een echte koopmelding.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas
      - run: |
          python -c "from bt.volg import stuur; stuur('TEST 0x2555: KOOP ETH', 'TEST - niet uitvoeren. Bitvavo ETH-EUR: koop voor €10. Prijs ~2400. (1/5 posities open)', 'high')"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
