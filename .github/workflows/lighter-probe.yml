name: lighter-probe

# Lighter stap 0 + 1 (lighter/probe.py), uitkomst op branch results, map lighter/probe
# Repo is publiek: logs bevatten alleen aantallen, bestanden alleen afgekorte adressen.
on:
  workflow_dispatch:
  push:
    branches: [lighter]
    paths: ["lighter/**", ".github/workflows/lighter-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests websockets
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
          rm -rf res/lighter/probe && mkdir -p res/lighter/probe
          echo "gestart $(date -u)" > res/lighter/probe/status.txt
          cd res && git add -A lighter && git commit -qm "lighter probe gestart [skip ci]" && git push -q origin HEAD:results || true
      - name: S3-archief zonder sleutel proberen (gratis)
        continue-on-error: true
        run: |
          o=res/lighter/probe/s3.txt
          echo "== aws s3 ls --no-sign-request" > $o
          timeout 60 aws s3 ls s3://lighter-historical-data/trade-daily/ --no-sign-request --request-payer requester 2>&1 | head -20 >> $o || true
          echo "== https list (anoniem, requester-pays header)" >> $o
          curl -s -m 30 -H "x-amz-request-payer: requester" "https://lighter-historical-data.s3.amazonaws.com/?list-type=2&prefix=trade-daily/&max-keys=10" | head -c 3000 >> $o || true
          echo >> $o; echo "== https list (anoniem)" >> $o
          curl -s -m 30 "https://lighter-historical-data.s3.amazonaws.com/?list-type=2&prefix=trade-daily/&max-keys=10" | head -c 1500 >> $o || true
      - run: python -m lighter.probe res res/lighter/probe
        env: {FEED_MIN: "15", BREED_N: "1500", BREED_BUDGET_S: "1200"}
      - name: Opslaan
        if: always()
        run: |
          echo "klaar $(date -u) status ${{ job.status }}" >> res/lighter/probe/status.txt
          cd res && git add -A lighter
          git commit -qm "lighter probe $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
