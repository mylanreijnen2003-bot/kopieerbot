name: orderly-select

# Orderly stap 2-7 (orderly/select.py): pool -> 8 parallelle shards (eigen IP = eigen rate-limit) -> kiezen.
# Instellingen in orderly/RUN. Uitkomst op branch results, map orderly/$UIT.
on:
  workflow_dispatch:
  push:
    branches: [orderly]
    paths: ["orderly/RUN"]

permissions:
  contents: write

jobs:
  pool:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - run: cat orderly/RUN >> "$GITHUB_ENV"
      - run: python -m orderly.select pool out/pool
      - uses: actions/upload-artifact@v4
        with: {name: orderly-pool, path: out/pool}

  shard:
    needs: pool
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: {i: [0, 1, 2, 3, 4, 5, 6, 7]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - run: cat orderly/RUN >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: {name: orderly-pool, path: out/pool}
      - run: python -m orderly.select shard out/s${{ matrix.i }} out/pool/pool_lijst.csv ${{ matrix.i }} 8
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "orderly-shard-${{ matrix.i }}", path: "out/s${{ matrix.i }}"}

  kies:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - run: cat orderly/RUN >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: {pattern: "orderly-*", path: out}
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
          rm -rf "res/orderly/$UIT" && mkdir -p "res/orderly/$UIT/shards"
      - run: python -m orderly.select kies "res/orderly/$UIT" out/orderly-shard-*
      - name: Opslaan
        if: always()
        run: |
          cp out/orderly-pool/pool_lijst.csv "res/orderly/$UIT/" || true
          for d in out/orderly-shard-*; do n=$(basename $d); mkdir -p "res/orderly/$UIT/shards/$n"; cp $d/log.txt $d/voorfilter.csv $d/shard.json "res/orderly/$UIT/shards/$n/" 2>/dev/null || true; done
          echo "klaar $(date -u) run ${{ github.run_id }}" > "res/orderly/$UIT/status.txt"
          cd res && git add -A orderly
          git commit -qm "orderly select $UIT $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
