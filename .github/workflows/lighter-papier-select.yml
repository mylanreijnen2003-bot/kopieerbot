name: lighter-papier-select

# Papier C (Lighter): selectie maken uit de versleutelde scan-delen (runs in lighter/papier_regel.json) en de bot starten.
# Start door lighter/papier_regel.json te wijzigen. Repo is publiek: selectie en stand alleen versleuteld (LIGHTER_DATA_KEY).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lighter/papier_regel.json"]

permissions:
  contents: write
  actions: read

concurrency:
  group: papierC
  cancel-in-progress: false

env:
  KEY: ${{ secrets.LIGHTER_DATA_KEY }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas pyarrow numpy
      - name: Versleutelde scan-delen ophalen
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          for id in $(python -c "import json;print(' '.join(map(str,json.load(open('lighter/papier_regel.json'))['runs'])))"); do
            mkdir -p enc/$id && gh run download $id -R ${{ github.repository }} -p 'lighter-part-*' -D enc/$id || true
          done
          mkdir -p dat
          for f in enc/*/*/part.tgz.enc; do
            d=dat/$(echo $f | cut -d/ -f2)-$(basename $(dirname $f)); mkdir -p $d
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in $f | tar xzf - -C $d
          done
          echo "delen: $(ls dat | wc -l)"
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
          mkdir -p res/papierC w
      - run: python -m lighter.papier_select dat res/vast/kraken.json lighter/papier_regel.json w res/papierC
      - name: Bot starten (of verder met bestaande stand)
        env: {NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}"}
        run: |
          if [ -f res/papierC/state.enc ]; then openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in res/papierC/state.enc -out w/state.json; fi
          python -m lighter.papier w res/papierC res/vast/kraken.json
      - name: Versleuteld opslaan
        if: always()
        run: |
          for f in selectie state; do
            [ -f w/$f.json ] && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in w/$f.json -out res/papierC/$f.enc
          done
          rm -rf w
          cd res && git add -A papierC
          git commit -qm "papier C selectie $(date -u +%F-%H) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
