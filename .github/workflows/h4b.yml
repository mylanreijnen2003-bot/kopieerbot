name: h4b

# H4b eenmalig: 5 kopieerbare traders kiezen + papieren bot starten. Daarna dagelijks via paper-h4.yml.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  h4b:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - uses: actions/download-artifact@v4
        with: {pattern: "h4-sim-*", path: sim, run-id: "37133019648", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {pattern: "bt-prep-beurzen", path: dat, run-id: "37124999519", github-token: "${{ github.token }}"}
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
      - run: python -m bt.h4b sim dat res/paper_h4b
      - run: python -m bot.paper res/paper_h4b res/paper_h4b/selection.json res/paper_h4b/kraken.json
        env: {REGELS: H4b}
      - run: python -m bot.report res/paper_h4b
      - name: Opslaan
        if: always()
        run: |
          cd res && git add -A paper_h4b
          git commit -qm "H4b start $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
