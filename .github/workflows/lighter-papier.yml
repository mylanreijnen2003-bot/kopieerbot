name: lighter-papier

# Papier C (Lighter): top 5 Lighter-traders op papier bijwerken, elke 6 uur (dagupdate naar telefoon om ~06:53 UTC).
# Selectie en stand alleen versleuteld (LIGHTER_DATA_KEY); openbaar rapport met afgekorte adressen in results/papierC.
on:
  workflow_dispatch:
  schedule:
    - cron: "53 */6 * * *"

permissions:
  contents: write

concurrency:
  group: papierC
  cancel-in-progress: false

env:
  KEY: ${{ secrets.LIGHTER_DATA_KEY }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas pyarrow numpy
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
      - name: Bijwerken
        env: {NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}"}
        run: |
          if [ ! -f res/papierC/selectie.enc ]; then echo "nog geen selectie"; exit 0; fi
          mkdir -p w
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in res/papierC/selectie.enc -out w/selectie.json
          if [ -f res/papierC/state.enc ]; then openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in res/papierC/state.enc -out w/state.json; fi
          python -m lighter.papier w res/papierC res/vast/kraken.json
      - name: Versleuteld opslaan
        if: always()
        run: |
          [ -f w/state.json ] && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in w/state.json -out res/papierC/state.enc
          rm -rf w
          cd res && git add -A papierC
          git commit -qm "papier C $(date -u +%F-%H) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
