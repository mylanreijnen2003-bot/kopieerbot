name: uren

on:
  workflow_dispatch:
    inputs:
      adres: {required: true}
      dagen: {required: true, default: "183"}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy requests pyarrow
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
      - run: |
          mkdir -p res/wat_als/${{ inputs.adres }}
          python -m bt.uren ${{ inputs.adres }} ${{ inputs.dagen }} res/papier2/bitvavo.json res/wat_als/${{ inputs.adres }} 2>&1 | tee res/wat_als/${{ inputs.adres }}/uren_log.txt
      - name: Opslaan
        if: always()
        run: |
          cd res && git add -A wat_als
          git commit -qm "uren $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
