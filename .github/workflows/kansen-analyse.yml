name: kansen-analyse

# Alleen opnieuw analyseren op al opgehaalde (versleutelde) data: vaults (run VAULT_RUN) en GMX (run GMX_RUN).
# Start: wijzig kansen/vaults.py, kansen/gmx.py, kansen/kies.py of dit bestand.
on:
  push:
    branches: [kansen]
    paths: ["kansen/vaults.py", "kansen/gmx.py", "kansen/kies.py", ".github/workflows/kansen-analyse.yml"]

permissions:
  contents: write
  actions: read

env:
  KEY: ${{ secrets.LIGHTER_DATA_KEY }}
  VAULT_RUN: "37185378336"
  GMX_RUN: "37185378337"

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with: {pattern: "vaults-part-*", path: enc/vaults, run-id: "${{ env.VAULT_RUN }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {name: gmx-dat, path: enc/gmx, run-id: "${{ env.GMX_RUN }}", github-token: "${{ github.token }}"}
      - name: Ontsleutelen
        run: |
          mkdir -p dat/vaults dat/gmxroot
          for f in enc/vaults/*/part.tgz.enc; do openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in $f | tar xzf - -C dat/vaults; done
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in enc/gmx/gmx-dat.tgz.enc | tar xzf - -C dat/gmxroot
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
          rm -rf res/kansen/vaults res/kansen/gmx && mkdir -p res/kansen/vaults res/kansen/gmx
      - run: python -m kansen.vaults analyse dat/vaults res/kansen/vaults priv/vaults
      - run: python -m kansen.gmx analyse dat/gmxroot res/kansen/gmx priv/gmx
      - name: Opslaan
        if: always()
        run: |
          for v in vaults gmx; do
            if [ -d priv/$v ]; then tar czf - priv/$v | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out res/kansen/$v/priv.tgz.enc; fi
          done
          cd res
          for i in 1 2 3 4 5; do
            git fetch -q origin results && git reset -q --soft origin/results
            git add -A kansen/vaults kansen/gmx
            git commit -qm "kansen analyse $(date -u +%F) [skip ci]" || true
            git push -q origin HEAD:results && break; sleep 10
          done
