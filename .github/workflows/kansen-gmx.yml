name: kansen-gmx

# V3 GMX v2-traders (kansen/gmx.py). Publiek: report.md met afgekorte adressen; ruwe data versleuteld (LIGHTER_DATA_KEY).
on:
  push:
    branches: [kansen]
    paths: ["kansen/gmx.py", "kansen/kies.py", ".github/workflows/kansen-gmx.yml"]

permissions:
  contents: write

env:
  KEY: ${{ secrets.LIGHTER_DATA_KEY }}

jobs:
  gmx:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Sleutel aanwezig?
        run: if [ ${#KEY} -lt 20 ]; then echo "Secret LIGHTER_DATA_KEY ontbreekt"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas pyarrow numpy
      - run: python -m kansen.gmx fetch dat
      - name: Resultatenbranch klaarzetten
        if: always()
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
          rm -rf res/kansen/gmx && mkdir -p res/kansen/gmx
      - run: python -m kansen.gmx analyse dat res/kansen/gmx priv
      - name: Opslaan
        if: always()
        run: |
          if [ -d priv ]; then tar czf - priv | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out res/kansen/gmx/priv.tgz.enc; fi
          if [ -d dat ]; then tar czf - dat | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out gmx-dat.tgz.enc; fi
          cd res && git add -A kansen
          git commit -qm "kansen gmx $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gmx-dat, path: gmx-dat.tgz.enc, retention-days: 90, if-no-files-found: ignore}
