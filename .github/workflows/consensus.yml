name: consensus

# Consensus van alle 'lang winstgevende' rustige traders (keuze t/m 18-8), getoetst 19-8 t/m gisteren.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  KLUIS_KEY: ${{ secrets.DATA_KEY }}
  VAR: "37157905999"

jobs:
  groep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - uses: actions/download-artifact@v4
        with: {pattern: "var-stats-*", path: st, run-id: "${{ env.VAR }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {name: var-uni, path: uni, run-id: "${{ env.VAR }}", github-token: "${{ github.token }}"}
      - run: python -m bt.cons groep st uni/universe.parquet g
      - uses: actions/upload-artifact@v4
        with: {name: cs-groep, path: g, retention-days: 30}

  fills:
    needs: groep
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - uses: actions/download-artifact@v4
        with: {name: cs-groep, path: g}
      - run: python -m bt.cons fills ${{ matrix.shard }} 8 g/groep.parquet out
      - uses: actions/upload-artifact@v4
        with: {name: "cs-fills-${{ matrix.shard }}", path: out, retention-days: 30}

  sim:
    needs: fills
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - uses: actions/download-artifact@v4
        with: {pattern: "cs-fills-*", path: cf}
      - uses: actions/download-artifact@v4
        with: {pattern: "bt-prep-beurzen", path: beurs, run-id: "37124999519", github-token: "${{ github.token }}"}
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results && python3 bt/kluis.py open res
      - run: mkdir -p res/consensus && python -m bt.cons sim cf beurs res/consensus
      - name: Opslaan
        if: always()
        run: |
          cd res && python3 ../bt/kluis.py dicht . && git add -A consensus
          git commit -qm "consensus $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
