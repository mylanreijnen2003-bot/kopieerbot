name: historie

# Volledige datasetgeschiedenis (aug 2025 - aug 2026) van de recent-top 30.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy huggingface_hub requests
      - run: git fetch origin results && git show origin/results:recent/top60.csv > top60.csv && python -m bt.historie uni top60.csv uni
      - run: python -m bt.extract ${{ matrix.shard }} 8 part && rm -f part/bars_*.parquet
        env: {UNIVERSE: uni/universe.parquet}
      - uses: actions/upload-artifact@v4
        with: {name: "hist-part-${{ matrix.shard }}", path: part, retention-days: 30}

  stats:
    needs: extract
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - uses: actions/download-artifact@v4
        with: {pattern: "hist-part-*", path: dat}
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
      - run: mkdir -p res/historie && python -m bt.historie stats res/recent/top60.csv dat res/historie
      - name: Opslaan
        if: always()
        run: |
          cd res && git add -A historie
          git commit -qm "historie $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
