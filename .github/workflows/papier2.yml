name: papier2

# Papier v2: versie A en B bijwerken, elke 6 uur.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: write

concurrency:
  group: papier2
  cancel-in-progress: false

env:
  KLUIS_KEY: ${{ secrets.DATA_KEY }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results && python3 bt/kluis.py open res
      - name: Bijwerken
        run: |
          if [ ! -f res/papier2/selectie.json ]; then echo "nog geen selectie"; exit 0; fi
          python -m bt.papier2 res/papier2
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Opslaan
        if: always()
        run: |
          cd res && python3 ../bt/kluis.py dicht . && git add -A papier2
          git commit -qm "papier2 $(date -u +%F-%H) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
