name: orderly-check

# Open posities + DCA-check voor gekozen wallets (orderly/check5.py). Adressen in orderly/CHECK.
on:
  workflow_dispatch:
  push:
    branches: [orderly]
    paths: ["orderly/CHECK"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
          rm -rf res/orderly/check && mkdir -p res/orderly/check
      - run: python -m orderly.check5 res/orderly/check $(cat orderly/CHECK)
      - name: Opslaan
        if: always()
        run: |
          echo "klaar $(date -u)" > res/orderly/check/status.txt
          cd res && git add -A orderly
          git commit -qm "orderly check $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
