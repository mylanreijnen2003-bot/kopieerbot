name: kansen-vaults

# V1 Hyperliquid-vaults persistentie (kansen/vaults.py, regels in kansen/VOORREGISTRATIE.md).
# Publiek: report.md met afgekorte adressen. Ruwe data en volledige keuze alleen versleuteld (LIGHTER_DATA_KEY).
on:
  push:
    branches: [kansen]
    paths: ["kansen/vaults.py", ".github/workflows/kansen-vaults.yml"]

permissions:
  contents: write
  actions: read

env:
  KEY: ${{ secrets.LIGHTER_DATA_KEY }}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Sleutel aanwezig?
        run: if [ ${#KEY} -lt 20 ]; then echo "Secret LIGHTER_DATA_KEY ontbreekt"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python -m kansen.vaults fetch ${{ matrix.shard }} 8 part
      - name: Versleutelen
        if: always()
        run: |
          [ -d part ] || exit 0
          tar czf - part | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out part.tgz.enc
          rm -rf part
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "vaults-part-${{ matrix.shard }}", path: part.tgz.enc, retention-days: 90, if-no-files-found: ignore}

  analyse:
    needs: fetch
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with: {pattern: "vaults-part-*", path: enc}
      - name: Ontsleutelen
        run: |
          mkdir -p dat
          for f in enc/*/part.tgz.enc; do openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in $f | tar xzf - -C dat; done
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results
          rm -rf res/kansen/vaults && mkdir -p res/kansen/vaults
      - run: python -m kansen.vaults analyse dat res/kansen/vaults priv
      - name: Opslaan
        if: always()
        run: |
          if [ -d priv ]; then tar czf - priv | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out res/kansen/vaults/priv.tgz.enc; fi
          cd res && git add -A kansen
          git commit -qm "kansen vaults $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
