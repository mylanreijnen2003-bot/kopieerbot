name: rot-select2

# Rotatie-variant '0x2555-type' (lange houdtijd, groot voordeel per trade) op bestaande rot-stats.
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "rotatie-run met rot-stats", required: true, default: "37197767731"}

permissions:
  contents: write
  actions: read

env:
  KLUIS_KEY: ${{ secrets.DATA_KEY }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - uses: actions/download-artifact@v4
        with: {pattern: "rot-stats-*", path: st, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results && python3 bt/kluis.py open res
      - run: mkdir -p res/rotatie2 && python -m bt.rot_select2 st res/rotatie2
      - name: Opslaan
        if: always()
        run: |
          cd res && python3 ../bt/kluis.py dicht . && git add -A rotatie2
          git commit -qm "rotatie2 $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
