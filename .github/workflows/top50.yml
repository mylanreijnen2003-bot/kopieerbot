name: top50

# Top 50 winstgevende wallets uit honderd (>= 3 trades van +50%), uitgebreide statistieken. Uitkomst: results/top50/ (versleuteld).
on:
  workflow_dispatch:
    inputs:
      run_id: {required: true, default: "37220230369"}

permissions:
  contents: write
  actions: read

env:
  KLUIS_KEY: ${{ secrets.DATA_KEY }}

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - run: git fetch origin results && python3 bt/kluis.py show honderd/wallets_50pct.csv > k.csv
      - uses: actions/download-artifact@v4
        with: {pattern: "h-part-*", path: dat, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {pattern: "bt-prep-beurzen", path: beurs, run-id: "37124999519", github-token: "${{ github.token }}"}
      - run: python -m bt.top50 stats ${{ matrix.shard }} 4 k.csv dat beurs out && python3 bt/kluis.py alles out
      - uses: actions/upload-artifact@v4
        with: {name: "t50-stats-${{ matrix.shard }}", path: out, retention-days: 3}

  kies:
    needs: stats
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy requests
      - uses: actions/download-artifact@v4
        with: {pattern: "t50-stats-*", path: st}
      - run: python3 bt/kluis.py open st
      - name: Resultatenbranch klaarzetten
        run: |
          git config --global user.name "kopieerbot"; git config --global user.email "actions@users.noreply.github.com"
          git fetch origin results && git worktree add -B results res origin/results && python3 bt/kluis.py open res
      - run: rm -rf res/top50 && mkdir -p res/top50 && python -m bt.top50 kies st res/top50 2>&1 | tee res/top50/log.txt
      - name: Opslaan
        if: always()
        run: |
          cd res && python3 ../bt/kluis.py dicht . && git add -A top50
          git commit -qm "top50 $(date -u +%F) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin results && git push -q origin HEAD:results && break; sleep 10; done
